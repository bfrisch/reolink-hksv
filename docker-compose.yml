# Host networking is required so HomeKit can discover the accessories via mDNS.
# /dev/dri is AMD + Intel. NVIDIA also needs docker-compose.nvidia.yml.

services:
  reolink-hksv:
    build: .
    image: reolink-hksv:latest
    container_name: reolink-hksv
    network_mode: host
    restart: unless-stopped
    group_add:
      - video
    devices:
      - /dev/dri:/dev/dri
    volumes:
      - ./config.yaml:/app/config.yaml:ro
      - ./data:/app/data
    environment:
      TZ: America/New_York
      NVIDIA_DRIVER_CAPABILITIES: compute,utility,video
