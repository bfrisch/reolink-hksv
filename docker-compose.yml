# File format 2.4 is the newest docker-compose 1.25.0 accepts that still
# allows group_add. Host networking is required so HomeKit can discover the
# accessories via mDNS. /dev/dri is AMD + Intel. NVIDIA also needs
# docker-compose.nvidia.yml.

version: "2.4"

services:
  reolink-hksv:
    build: .
    image: ghcr.io/bfrisch/reolink-hksv:latest
    container_name: reolink-hksv
    network_mode: host
    restart: unless-stopped
    group_add:
      - video
    devices:
      - /dev/dri:/dev/dri
    volumes:
      - ./config.yaml:/app/config.yaml:ro
      - ./data:/app/data
    environment:
      TZ: America/New_York
      NVIDIA_DRIVER_CAPABILITIES: compute,utility,video
